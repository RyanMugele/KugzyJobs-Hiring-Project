<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
  --gold: #f1b418;
  --navy: #214162;
  --yellow: #f7f196;
  --white: #eeeff2;
  --dark-brown: #110b05;
  --light-gray: #536e87;
  --light-brown: #fef8e8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          line-height: 1.7;
          background-color: #f5f5f5;
          color: #110b05;
          -webkit-font-smoothing: antialiased;
        }

        .email-wrapper {
          background-color: #f5f5f5;
          padding: 40px 20px;
        }

        .email-container {
          max-width: 600px;
          margin: 0 auto;
          background-color: white;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .header {
          color: white;
          text-align: center;
          padding: 40px;
          background-color: #214162;
          background-image: linear-gradient(135deg, #214162 0%, #2c5a8f 100%);
        }

        .header img {
          max-width: 180px;
          height: auto;
        }

        .content {
          padding: 48px 40px;
          background-color: white;
        }

        .content h2 {
          color: #214162;
          font-weight: 600;
          font-size: 24px;
          margin-bottom: 24px;
          letter-spacing: -0.5px;
        }

        .content p {
          margin-bottom: 20px;
          color: #374151;
          font-size: 16px;
        }

        .btn {
          display: inline-block;
          padding: 14px 32px;
          background-color: #f1b418;
          color: #110b05;
          text-decoration: none;
          border-radius: 8px;
          font-weight: 600;
          font-size: 16px;
          transition: transform 0.2s;
          text-align: center;
          box-shadow: 0 2px 4px rgba(241, 180, 24, 0.2);
        }

        .btn:hover {
          transform: translateY(-1px);
          box-shadow: 0 4px 6px rgba(241, 180, 24, 0.3);
        }

        .footer {
          text-align: center;
          padding: 32px 40px;
          background-color: #fef8e8;
          border-top: 1px solid rgba(17, 11, 5, 0.05);
        }

        .footer p {
          color: #110b05;
          font-size: 14px;
          line-height: 1.6;
          margin-bottom: 8px;
        }

        .contact-info {
          margin-top: 24px;
          padding-top: 24px;
          border-top: 1px solid rgba(17, 11, 5, 0.08);
          color: #536e87;
          font-size: 13px;
        }

        @media (max-width: 600px) {
          .content {
            padding: 32px 24px;
          }

          .footer {
            padding: 24px 20px;
          }
        }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="email-container">
        <div class="header">
          <img src="https://beetbox.co.ke/static/img/logo.png" alt="Beetbox Investments LTD">
        </div>

        <div class="content">
          {% block content %}{% endblock %}
        </div>

        <div class="footer">
          <p style="font-weight: 600;">Beetbox Investments LTD</p>
	  <p>Gateway mall 3rd floor shop t12<br>
	  Syokimau<br>
          Nairobi, Kenya</p>
          <div class="contact-info">
            <p>Email: sales@beetbox.co.ke | Phone: +254 701 688061</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
